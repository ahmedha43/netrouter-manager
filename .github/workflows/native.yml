name: Native Build and Test

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "platform/**"
      - "scripts/**"
      - ".github/workflows/native.yml"
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - "platform/**"
      - "scripts/**"
      - ".github/workflows/native.yml"

permissions:
  contents: read

jobs:
  native-x86_64:
    name: Go daemon and Windows EXE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: native/go.sum

      - name: Install native build toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 libgl1-mesa-dev xorg-dev

      - name: Verify Go module metadata
        working-directory: native
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run native unit and integration tests
        working-directory: native
        run: go test ./...

      - name: Build Linux daemon and Windows manager
        run: ./scripts/build-native.sh

      - name: Verify Windows executable format
        run: file artifacts/windows/NetRouterManager.exe | grep -E "PE32\+ executable.*x86-64"

      - name: Upload native preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netrouter-native-x86_64
          if-no-files-found: error
          path: |
            artifacts/linux/netrouterd
            artifacts/linux/netrouterctl
            artifacts/windows/NetRouterManager.exe
