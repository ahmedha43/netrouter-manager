name: Publish NetRouter Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.5"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-netrouter-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. FAST JOB (~60s): Build & Publish Windows EXE & Linux Daemon Binaries
  # =========================================================================
  publish-manager:
    name: Build & Publish NetRouter Manager (EXE & Linux Binaries)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "Release tag must start with v followed by a version number" >&2; exit 2 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install MinGW and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 libgl1-mesa-dev xorg-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: native/go.sum

      - name: Verify tests & Build Manager and Binaries
        run: |
          ./scripts/build-native.sh

      - name: Package Windows & Linux release artifacts
        id: assets
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-binaries
          cp artifacts/windows/NetRouterManager.exe "release-binaries/NetRouterManager-${RELEASE_TAG}-x86_64.exe"
          cp artifacts/linux/netrouterd "release-binaries/netrouterd-${RELEASE_TAG}-x86_64"
          cp artifacts/linux/netrouterctl "release-binaries/netrouterctl-${RELEASE_TAG}-x86_64"
          file "release-binaries/NetRouterManager-${RELEASE_TAG}-x86_64.exe" | grep -E "PE32\+ executable.*x86-64"
          (
            cd release-binaries
            sha256sum ./* > SHA256SUMS-binaries.txt
          )
          echo "directory=release-binaries" >> "$GITHUB_OUTPUT"

      - name: Create / Update GitHub Release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSETS: ${{ steps.assets.outputs.directory }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSETS"/* --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ASSETS"/* \
              --target "$GITHUB_SHA" \
              --title "NetRouter OS $RELEASE_TAG" \
              --generate-notes
          fi

  # =========================================================================
  # 2. PARALLEL JOB: Build & Publish Bootable NetRouter OS ISO
  # =========================================================================
  publish-iso:
    name: Build & Publish Bootable ISO Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILDROOT_VERSION: "2026.05"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential bzip2 cpio file flex \
            libelf-dev libncurses-dev perl python3 rsync unzip wget

      - name: Cache Buildroot Downloads & Toolchain
        uses: actions/cache@v4
        with:
          path: |
            .cache/buildroot-${{ env.BUILDROOT_VERSION }}/dl
            artifacts/buildroot-x86_64/build/buildroot-config
          key: buildroot-dl-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('platform/buildroot-external/configs/netrouter_x86_64_defconfig') }}
          restore-keys: |
            buildroot-dl-${{ env.BUILDROOT_VERSION }}-

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: native/go.sum

      - name: Fetch Buildroot source
        run: |
          mkdir -p .cache
          if [ ! -d ".cache/buildroot-${BUILDROOT_VERSION}" ]; then
            wget -q "https://buildroot.org/downloads/buildroot-${BUILDROOT_VERSION}.tar.xz" -O /tmp/buildroot.tar.xz
            tar -xJf /tmp/buildroot.tar.xz -C .cache
          fi

      - name: Build bootable NetRouter OS image
        run: ./scripts/build-image-x86_64.sh

      - name: Upload ISO to Release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p iso-assets
          cp artifacts/buildroot-x86_64/images/rootfs.iso9660 "iso-assets/NetRouterOS-${RELEASE_TAG}-x86_64.iso"
          test -s "iso-assets/NetRouterOS-${RELEASE_TAG}-x86_64.iso"
          (
            cd iso-assets
            sha256sum ./* > SHA256SUMS-iso.txt
          )
          # Wait briefly for release creation if needed, then upload
          sleep 5
          gh release upload "$RELEASE_TAG" iso-assets/* --clobber
